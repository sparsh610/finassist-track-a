# Run 2: higher capacity, lower learning rate, fewer epochs.
run_name: run2_r64_lr1e-4
train:
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  learning_rate: 1.0e-4
  num_epochs: 2
  per_device_batch_size: 4
  grad_accum_steps: 4
  max_seq_length: 2048
  warmup_ratio: 0.03
  lr_scheduler: cosine
  completion_only_loss: true
