[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finassist"
version = "0.1.0"
description = "Track A capstone: fine-tuned, RAG-augmented financial-report assistant served with vLLM"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finassist.redteam" = ["prompts.jsonl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
